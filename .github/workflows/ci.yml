name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feedback-capture/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint:firefox
      - run: npm run check
      - run: npx playwright install --with-deps firefox
      - run: npm run test:browser
