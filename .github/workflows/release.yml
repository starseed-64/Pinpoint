name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the signed XPI matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r .version feedback-capture/extension/manifest.json)"
          [ "$version" = "$manifest_version" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"; exit 1; }
          file="releases/Pinpoint_v${version}.xpi"
          [ -f "$file" ] || { echo "Missing $file"; exit 1; }
          unzip -l "$file" | grep -q "META-INF/mozilla.rsa" || { echo "$file is not Mozilla-signed"; exit 1; }
          echo "RELEASE_FILE=$file" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RELEASE_FILE" --title "Pinpoint $GITHUB_REF_NAME" --generate-notes
