<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Pinpoint</title>
  </head>
  <body>
    <main>
      <div class="popup-brand">
        <picture>
          <source srcset="pinbox-logo-dark.png" media="(prefers-color-scheme: dark)" />
          <img class="brand-logo" src="pinbox-logo-light.png" alt="Pinbox" />
        </picture>
      </div>
      <p class="description">Select an element and describe the fix.</p>
      <p id="inbox-count" class="inbox-count" role="status" aria-live="polite">Checking Pinbox…</p>
      <div class="primary-actions">
        <button id="select-element" class="icon-button primary" type="button" aria-label="Select an Element" title="Select an Element" data-tooltip="Select an Element">
          <span class="plus-icon" aria-hidden="true">+</span>
        </button>
        <button id="open-inbox" class="icon-button secondary" type="button" aria-label="Open Pinbox" title="Open Pinbox" data-tooltip="Open Pinbox">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 8.5h6l2 2h9v8h-17zM3.5 8.5v-2h6l2 2" /></svg>
        </button>
        <button id="fix-everything" class="fix-everything" type="button">Fix Everything</button>
      </div>
      <p id="shortcut-hint" class="shortcut-hint" aria-live="polite"></p>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
